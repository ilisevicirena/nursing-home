name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "ngx-nursing-home/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ngx-nursing-home
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ngx-nursing-home/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build demo
        env:
          NODE_OPTIONS: --max_old_space_size=4096
        run: npx ng build --configuration demo --base-href "/${{ github.event.repository.name }}/"

      - name: Add SPA fallback for client-side routing
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ngx-nursing-home/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
