<div class="placeholder-filepicker file-formats" *ngIf="showAcceptedFormats || showMaxFilesNumber; else noFormat">
    <div *ngIf="showAcceptedFormats">{{allowedFilesPlaceholder}} {{accept}}</div>
    <div *ngIf="showMaxFilesNumber">{{maxFilesPlaceholder}} {{maxFiles}}
    </div>
</div>
<ng-template #noFormat>
    <div class="placeholder-filepicker file-formats">&nbsp;</div>
</ng-template>
<nb-tag-list *ngIf="files.length">
    <nb-tag nbTooltip={{file.size|byte}} nbTooltipPosition="top" [nbTooltipDisabled]="displayFileSize"
        *ngFor="let file of files" [removable]="!disabled" [text]="getFileName(file)" status="primary"
        appearance="filled" (remove)="removeFile(file)">
    </nb-tag>
</nb-tag-list>
<div class="placeholder-filepicker text-center" *ngIf="!files.length">{{emptyPlaceholder}}<br><button type="button"
        [disabled]="disabled" style="margin-top: 0.5rem; text-transform: none;" nbButton size="small" shape="round"
        status="primary">{{buttonPlaceholder}}<nb-icon pack="eva" icon="cloud-upload-outline" nbSuffix>
        </nb-icon>
    </button>
</div>
<div class="placeholder-filepicker maxFiles" *ngIf="files.length>=maxFiles!">
    <nb-icon status="danger" pack="eva" icon="alert-circle-outline"></nb-icon>
    {{maxFilesWarningMessage}} ({{maxFiles}}).
</div>
<input #fileInputEl class="hidden" #fileInput name="filecontrol" type="file" [attr.multiple]="multiple? '' : null"
    [attr.accept]="accept">
