<div
  class="ngx-grid"
  [id]="id"
  [nbSpinner]="loading"
  nbSpinnerSize="large"
  nbSpinnerStatus="primary"
  [nbSpinnerMessage]="loadingMessage"
>
  <ngx-grid-toolbar
    [visible]="getGridToolbarVisibility()"
    [selectedRowsTitleEnabled]="selectedRowsTitleEnabled"
    [selectionMultiple]="selectionMultiple"
    [selectedRows]="getSelectedRows().length"
    [selectedRowsTitle]="selectedRowsTitle"
    [addEnabled]="addEnabled"
    [addTooltip]="addTooltip"
    (addNewClicked)="addNewClick()"
  >
  </ngx-grid-toolbar>

  <!--------------------------------------------------- TABLE START ---------------------------------------------------------------------->
  <div
    class="ngx-grid-table"
    [ngClass]="getGridFooterVisibility() ? '' : 'no-footer'"
    [class]="getGridToolbarVisibility() ? '' : 'no-header'"
  >
    <table>
      <thead>
        <tr>
          <!--------------------------------------------------- SELECT ALL -------------------------------------------------------------->
          <th *ngIf="selectionEnabled" class="text-center sticky-th select-all">
            <nb-checkbox
              *ngIf="selectionMultiple && selectAllEnabled"
              indeterminate
              (checkedChange)="onSelectAllCheckedChange($event)"
            ></nb-checkbox>
          </th>

          <!--------------------------------------------------- TABLE HEADERS -------------------------------------------------------------->
          <th
            *ngFor="let column of columns"
            [hidden]="!column.getVisible()"
            [ngClass]="getColumnHeaderClassList(column)"
            [style.left.px]="calculateLeftPosition(column)"
            [style.min-width]="column.getWidth()"
            [style.max-width]="column.getWidth()"
            [id]="column.getId()"
          >
            {{ column.getTitle() }}
            <button
              class="column-sort-btn"
              nbButton
              ghost
              shape="round"
              size="small"
              *ngIf="column?.getSortState() != sortStates.NONE"
              (click)="onSortButtonClick(column)"
            >
              <nb-icon
                pack="eva"
                [icon]="
                  column?.getSortState() == sortStates.ASC
                    ? 'arrow-upward-outline'
                    : 'arrow-downward-outline'
                "
              ></nb-icon>
            </button>
            <button
              class="column-group-btn"
              nbButton
              ghost
              shape="round"
              size="small"
              *ngIf="column?.getGrouped()"
              (click)="onUngroupButtonClick(column)"
            >
              <nb-icon pack="eva" icon="layers-outline"></nb-icon>
            </button>
            <button
              *ngIf="columnOptionsEnabled"
              class="column-context-menu-btn"
              nbButton
              ghost
              size="small"
              shape="round"
              [nbContextMenu]="column.getContextMenuItems()"
              [nbContextMenuClass]="'ngx-grid-column-context-menu'"
              [nbContextMenuTag]="
                'column-context-menu-' + id + '-' + column.getContextMenuId()
              "
              [nbContextMenuPlacement]="position.BOTTOM_END"
              (click)="
                onColumnContextMenuButtonClick(column.getContextMenuItems())
              "
            >
              <nb-icon pack="eva" icon="more-horizontal-outline"></nb-icon>
            </button>
          </th>
        </tr>

        <!--------------------------------------------------- TABLE FILTERS -------------------------------------------------------------->
        <tr *ngIf="filtersEnabled" class="filter-panel">
          <th *ngIf="selectionEnabled"></th>
          <th
            *ngFor="let column of columns"
            [hidden]="!column.getVisible()"
            [ngClass]="column.getDocked() ? 'docked' : ''"
            [style.left.px]="calculateLeftPosition(column)"
          >
            <ngx-column-filter
              [column]="column"
              (filterChanged)="onGridFilterChange($event)"
            ></ngx-column-filter>
          </th>
        </tr>
      </thead>

      <!--------------------------------------------------- TABLE DATA -------------------------------------------------------------->
      <tbody>
        <tr
          [style.height.px]="rowHeight > 0 ? rowHeight : null"
          *ngIf="dataToRender.length == 0 && gridState == gridStates.NONE"
        >
          <td [colSpan]="columns.length">{{ noDataMessage }}</td>
        </tr>

        <!--------------------------------------------------- INLINE INSERT -------------------------------------------------------------->
        <tr
          *ngIf="gridState == gridStates.INSERT && gridMode == gridModes.INLINE"
        >
          <td *ngIf="selectionEnabled"></td>
          <td *ngFor="let column of columns">
            <ngx-cell-edit
              [column]="column"
              [(cellValue)]="newRowData[column.getDataField()]"
              (cellButtonClick)="inlineEditCellBtnClick($event)"
              [isNew]="true"
            ></ngx-cell-edit>
          </td>
        </tr>

        <tr
          [style.height.px]="rowHeight > 0 ? rowHeight : null"
          [ngClass]="row.selected ? 'selected' : ''"
          [class]="selectRowByClick && selectionEnabled ? 'clicable' : ''"
          *ngFor="
            let row of dataToRender
              | paginate
                : {
                    itemsPerPage: pagerEnabled ? defaultPerPageOption : 10000,
                    currentPage: page,
                    totalItems: dataToRender.length
                  }
          "
        >
          <td *ngIf="selectionEnabled && !row._GroupRow">
            <div class="d-flex justify-content-center align-items-center">
              <nb-checkbox
                [(ngModel)]="row.selected"
                (checkedChange)="onSelectionCheckboxClick(row, $event)"
              ></nb-checkbox>
            </div>
          </td>

          <!--------------------------------------------------- RENDER TABLE DATA -------------------------------------------------------------->

          <td
            (click)="onGroupRowClick(row)"
            [attr.colspan]="groupColspan"
            *ngIf="row._GroupRow"
            class="group-row"
          >
            <div class="d-flex w-100">
              <div class="group-row-name">
                {{ row._GroupName }}
                <span *ngIf="groupedColumn?.getShowGroupCount()"
                  >({{ row._GroupCount }})</span
                >
              </div>
              <div class="col m-0 p-0 d-flex justify-content-end">
                <nb-icon
                  class="me-3"
                  pack="eva"
                  status="basic"
                  [icon]="
                    row._GroupExpanded
                      ? 'chevron-up-outline'
                      : 'chevron-down-outline'
                  "
                ></nb-icon>
              </div>
            </div>
          </td>

          <td
            *ngFor="let column of columns; index as i"
            [hidden]="row._GroupRow ? true : !column.getVisible()"
            (click)="onRowDataClick(row, column)"
            [ngClass]="column.getDocked() ? 'docked' : ''"
            [style.left.px]="calculateLeftPosition(column)"
          >
            <ngx-cell-display
              *ngIf="row.mode != 'edit'"
              [column]="column"
              [row]="row"
              (buttonClick)="onActionButtonClick($event)"
            ></ngx-cell-display>

            <ngx-cell-edit
              *ngIf="
                row.mode == 'edit' &&
                gridState == gridStates.EDIT &&
                gridMode == gridModes.INLINE
              "
              [column]="column"
              [isNew]="false"
              [(cellValue)]="row[column.getDataField()]"
              (cellButtonClick)="inlineEditCellBtnClick($event, row)"
            ></ngx-cell-edit>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  <ngx-grid-footer
    [visible]="getGridFooterVisibility()"
    [(page)]="page"
    (pageChanged)="onPageChanged()"
    [refreshEnabled]="refreshEnabled"
    [refreshTooltip]="refreshTooltip"
    [exportPdfEnabled]="exportPdfEnabled"
    [exportExcelEnabled]="exportExcelEnabled"
    [exportPdfTooltip]="exportPdfTooltip"
    [exportExcelTooltip]="exportExcelTooltip"
    [entriesPerPageEnabled]="entriesPerPageEnabled"
    [entriesPerPageTooltip]="entriesPerPageTooltip"
    [(defaultPerPageOption)]="defaultPerPageOption"
    [entriesPerPageOptions]="entriesPerPageOptions"
    (resetFiltersClicked)="onClickResetFilters()"
    (exportPdfClicked)="exportPdfBtnClick()"
    (exportExcelClicked)="exportExcelBtnClick()"
    (selectionPerPageChanged)="onSelectedChangePagerPerPage($event)"
  ></ngx-grid-footer>
</div>
<ngx-grid-excel-export [settings]="exportSettings"></ngx-grid-excel-export>
<ngx-grid-pdf-export [settings]="exportSettings"></ngx-grid-pdf-export>
