<div
  class="grid-popover-content"
  [id]="'grid-popover-content-' + selectGridId"
  [style.width]="width + 'px'"
>
  <ngx-grid
    [columns]="columns"
    [data]="source"
    [addEnabled]="false"
    [entriesPerPageEnabled]="false"
    [pagerEnabled]="false"
    [refreshEnabled]="false"
    [exportPdfEnabled]="false"
    [exportExcelEnabled]="false"
    [selectionMultiple]="multiple"
    [selectAllEnabled]="false"
    [filtersEnabled]="searchEnabled"
    [editEnabled]="false"
    [deleteEnabled]="false"
    [selectedRowsTitleEnabled]="false"
    (selectionChanged)="selectionChanged($event)"
    [columnOptionsEnabled]="false"
  ></ngx-grid>
</div>
