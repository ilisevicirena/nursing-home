<nb-card class="delete-dialog-card">
  <nb-card-header>
    <div class="title-template d-flex">
      <nb-icon
        pack="eva"
        icon="alert-triangle-outline"
        status="danger"
      ></nb-icon>
      <div class="title">
        {{ settings.title }}
      </div>
    </div>
  </nb-card-header>
  <nb-card-body>
    {{ settings.text }}
    <div class="line"></div>
    <div class="row">
      <div class="d-flex justify-content-end p-2">
        <button
          nbButton
          ghost
          shape="round"
          class="me-2"
          size="small"
          (click)="onNoClick()"
        >
          {{ settings.noBtnText }}
        </button>
        <button
          nbButton
          status="primary"
          shape="round"
          size="small"
          (click)="onYesClick()"
        >
          {{ settings.yesBtnText }}
        </button>
      </div>
    </div>
  </nb-card-body>
</nb-card>
