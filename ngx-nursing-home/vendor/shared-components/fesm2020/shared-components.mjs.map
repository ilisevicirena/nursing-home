<div class="grid-toolbar d-flex" *ngIf="visible">
  <!--------------------------------------------------- SELECTED ROWS TITLE -------------------------------------------------------------->
  <div
    *ngIf="selectedRowsTitleEnabled"
    class="selected-rows"
    [ngClass]="selectionMultiple && selectedRows > 0 ? 'd-flex' : 'd-none'"
  >
    <span class="label m-0 p-0">{{ selectedRowsTitle }}</span
    ><span class="ms-1 me-0 mt-0 mb-0 p-0">{{ selectedRows }}</span>
  </div>

  <!--------------------------------------------------- ADD BUTTON ------------------------------------------------------------------------>
  <div
    *ngIf="addEnabled"
    class="col d-flex justify-content-end align-items-center"
  >
    <button
      nbButton
      ghost
      status="primary"
      shape="round"
      [nbTooltip]="addTooltip"
      [nbTooltipDisabled]="addTooltip.length == 0"
      (click)="addNewClick()"
    >
      <nb-icon pack="eva" icon="plus-outline"></nb-icon>
    </button>
  </div>
</div>
