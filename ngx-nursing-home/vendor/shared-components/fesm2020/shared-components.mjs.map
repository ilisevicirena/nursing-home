<nb-accordion [id]="id" class="tags-autocomplete">
  <nb-accordion-item
    [disabled]="disabled"
    [expanded]="expanded"
    #tagsAutocompleteAccordionItem
  >
    <nb-accordion-item-header [ngClass]="disabled ? 'disabled' : ''">
      <div
        class="placeholder-accordion"
        *ngIf="selectedItems.length == 0; else showTags"
      >
        {{ emptyPlaceholder }}
      </div>
      <ng-template #showTags>
        <div class="header-tags-container d-flex w-100">
          <div
            class="header-tags"
            #headerTags
            [ngClass]="displayArrow ? 'col-11' : 'col'"
          >
            <nb-tag-list>
              <nb-tag
                *ngFor="let tag of selectedItems"
                size="small"
                [text]="getTagText(tag)"
                [status]="tagStatus"
                [appearance]="tagAppereance"
              ></nb-tag>
            </nb-tag-list>
          </div>
          <div
            *ngIf="headerOverflown && displayDots"
            class="tag-overflown pt-0 pb-0 ps-2 pe-3"
          >
            <nb-icon
              pack="eva"
              icon="more-horizontal-outline"
              status="basic"
            ></nb-icon>
          </div>
          <div class="tags-sum" *ngIf="displayNumSelected">
            <nb-tag
              [appearance]="'filled'"
              size="small"
              [status]="tagStatus"
              [text]="selectedItems.length.toString()"
            >
            </nb-tag>
          </div>
        </div>
      </ng-template>
    </nb-accordion-item-header>
    <nb-accordion-item-body
      [ngClass]="
        floatingDroopDown ? 'tags-autocomplete-dropwdown-container' : ''
      "
    >
      <div class="tags-autocomplete-input-container row m-0 w-100">
        <div [ngClass]="inputWidthClass" class="p-0">
          <nb-form-field>
            <nb-icon pack="eva" icon="search-outline" nbPrefix></nb-icon>
            <input
              #autoInput
              size="small"
              nbInput
              fullWidth
              type="text"
              (input)="onChange()"
              shape="round"
              [placeholder]="inputPlaceholder"
              [nbAutocomplete]="auto"
            />
            <button
              nbButton
              nbSuffix
              (click)="clearInputValue()"
              ghost
              shape="round"
              *ngIf="showClearButton()"
            >
              <nb-icon pack="eva" icon="close-outline"></nb-icon>
            </button>
          </nb-form-field>
          <nb-autocomplete #auto (selectedChange)="onSelectionChange($event)">
            <nb-option
              *ngFor="let option of filteredOptions$ | async"
              [value]="option"
            >
              {{ getOptionText(option) }}
            </nb-option>
          </nb-autocomplete>
        </div>
      </div>
      <div class="tags-autocomplete-tags-container row ms-0 me-0 w-100 mt-2">
        <nb-tag-list class="p-0">
          <nb-tag
            *ngFor="let tag of selectedItems"
            [text]="getTagText(tag)"
            removable
            [status]="tagStatus"
            [appearance]="tagAppereance"
            size="small"
            (remove)="onTagRemove(tag)"
          ></nb-tag>
        </nb-tag-list>
      </div>
      <div class="accordion-footer mt-2" *ngIf="clearEnabled">
        <div class="line w-100"></div>
        <div class="w-100 d-flex justify-content-end pt-2">
          <button
            nbButton
            ghost
            shape="round"
            (click)="clear()"
            size="small"
            [nbTooltip]="clearBtnTooltip"
          >
            <nb-icon pack="eva" icon="refresh-outline"></nb-icon>
          </button>
        </div>
      </div>
    </nb-accordion-item-body>
  </nb-accordion-item>
</nb-accordion>
