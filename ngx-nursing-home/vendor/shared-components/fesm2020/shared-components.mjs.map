<div class="select-grid" [id]="id" (resized)="onGridResized()">
  <nb-form-field
    [nbPopover]="popover"
    nbPopoverTrigger="noop"
    [nbPopoverPlacement]="position"
    (click)="toggleGridSelect()"
  >
    <input
      class="grid-select-input"
      nbInput
      [placeholder]="placeholder"
      [disabled]="disabled"
      fullWidth
      readonly
      [(ngModel)]="inputValue"
      [name]="id"
    />
    <nb-icon
      class="grid-select-input"
      pack="eva"
      [icon]="gridSelectOpen ? 'chevron-up-outline' : 'chevron-down-outline'"
      nbSuffix
    ></nb-icon>
  </nb-form-field>
</div>

<ng-template #popover>
  <ngx-select-grid-popover
    [selectGridId]="id"
    [width]="getSelectGridWidth()"
    [columns]="columns"
    [multiple]="multiple"
    [source]="source"
    [searchEnabled]="searchEnabled"
    [selected]="selected"
    [valueAttr]="valueAttr"
    (gridSelectionChanged)="gridSelectionChanged($event)"
  ></ngx-select-grid-popover>
</ng-template>
