<div class="popup-content">
  <form #form="ngForm">
    <div class="row">
      <div
        *ngFor="let column of columns"
        [ngClass]="column.getEditorSettings().getWidthClass()"
        [hidden]="
          column.getEditor() == editorTypes.ACTION
            ? true
            : !column.getEditorSettings().getShow()
        "
        class="form-group"
      >
        <div class="label">
          {{ column.getEditorSettings().getLabel()
          }}<nb-icon
            pack="eva"
            icon="alert-circle-outline"
            status="danger"
            *ngIf="column.getEditorSettings().getRequired()"
            size="small"
            class="ms-1 required-mark"
            [nbTooltip]="requiredTooltip"
          ></nb-icon>
        </div>
        <div class="value" [ngSwitch]="column.getEditor()">
          <nb-select
            *ngSwitchCase="editorTypes.SELECT"
            fullWidth
            [required]="column.getEditorSettings().getRequired()"
            [name]="column.getDataField()"
            [(selected)]="newData[column.getDataField()]"
            (selectedChange)="validatePopupForm()"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            [placeholder]="column.getEditorSettings().getLabel()"
          >
            <nb-option
              *ngFor="let option of column.getEditorSettings().getDataSource()"
              [value]="option[column.getEditorSettings().getKeyExpression()]"
            >
              {{
                option[column.getEditorSettings().getDisplayExpression()]
              }}</nb-option
            >
          </nb-select>
          <nb-checkbox
            *ngSwitchCase="editorTypes.CHECKBOX"
            status="primary"
            [required]="column.getEditorSettings().getRequired()"
            [(ngModel)]="newData[column.getDataField()]"
            (checkedChange)="validatePopupForm()"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            [name]="column.getDataField()"
          >
          </nb-checkbox>
          <nb-toggle
            *ngSwitchCase="editorTypes.TOGGLE"
            status="primary"
            [required]="column.getEditorSettings().getRequired()"
            [name]="column.getDataField()"
            [(ngModel)]="newData[column.getDataField()]"
            (checkedChange)="validatePopupForm()"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
          >
          </nb-toggle>
          <ng-container *ngSwitchCase="editorTypes.DATE_PICKER">
            <nb-form-field *ngIf="datePickerTypes.DATE">
              <input
                nbInput
                [placeholder]="column.getEditorSettings().getLabel()"
                [nbDatepicker]="datepicker"
                fullWidth
                #datepickerInput
                [(ngModel)]="newData[column.getDataField()]"
                [name]="column.getDataField()"
                [disabled]="
                  isNew ? !column.getAddable() : !column.getEditable()
                "
              />
              <button
                nbButton
                nbSuffix
                ghost
                status="primary"
                (click)="openDatepicker(datepickerInput)"
              >
                <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
              </button>
              <nb-datepicker
                #datepicker
                format="{{ column.getEditorSettings().getFormat() }}"
                [filter]="column.getEditorSettings().getFilterDates()"
                (dateChange)="onDateChange(column, $event)"
                [showNavigation]="
                  column.getEditorSettings().getShowNavigation()
                "
                [showWeekNumber]="
                  column.getEditorSettings().getShowWeekNumbers()
                "
              >
              </nb-datepicker>
            </nb-form-field>

            <nb-form-field *ngIf="datePickerTypes.DATE_TIME">
              <input
                nbInput
                [placeholder]="column.getEditorSettings().getLabel()"
                [name]="column.getDataField()"
                [nbDatepicker]="dateTimePicker"
                [(ngModel)]="newData[column.getDataField()]"
                fullWidth
                #datetimepickerInput
                [disabled]="
                  isNew ? !column.getAddable() : !column.getEditable()
                "
              />
              <button
                nbButton
                nbSuffix
                ghost
                status="primary"
                (click)="openDatepicker(datetimepickerInput)"
              >
                <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
              </button>
              <nb-date-timepicker
                #dateTimePicker
                format="{{ column.getEditorSettings().getFormat() }}"
                [filter]="column.getEditorSettings().getFilterDates()"
                (dateTimeChange)="onDateChange(column, $event)"
                [showNavigation]="
                  column.getEditorSettings().getShowNavigation()
                "
                [showWeekNumber]="
                  column.getEditorSettings().getShowWeekNumbers()
                "
                [singleColumn]="column.getEditorSettings().getSingleColumn()"
                [withSeconds]="column.getEditorSettings().getShowSeconds()"
                [twelveHoursFormat]="
                  column.getEditorSettings().getTwelveHoursFormat()
                "
                [step]="column.getEditorSettings().getTimeStep()"
              >
              </nb-date-timepicker>
            </nb-form-field>
            <nb-form-field *ngIf="datePickerTypes.TIME">
              <input
                nbInput
                [placeholder]="column.getEditorSettings().getLabel()"
                [nbTimepicker]="timePicker"
                fullWidth
                #timepickerInput
                [(ngModel)]="newData[column.getDataField()]"
                [name]="column.getDataField()"
                [disabled]="
                  isNew ? !column.getAddable() : !column.getEditable()
                "
              />
              <button
                nbButton
                nbSuffix
                ghost
                status="primary"
                (click)="openDatepicker(timepickerInput)"
              >
                <nb-icon pack="eva" icon="clock-outline"></nb-icon>
              </button>
              <nb-timepicker
                #timePicker
                timeFormat="{{ column.getEditorSettings().getFormat() }}"
                [ampmText]="column.getEditorSettings().getTimeText()"
                [applyButtonText]="
                  column.getEditorSettings().getApplyButtonText()
                "
                [currentTimeButtonText]="
                  column.getEditorSettings().getCurrentTimeButtonText()
                "
                [hoursText]="column.getEditorSettings().getHoursText()"
                [minutesText]="column.getEditorSettings().getMinutesText()"
                [secondsText]="column.getEditorSettings().getSecondsText()"
                [showFooter]="column.getEditorSettings().getShowFooter()"
                [singleColumn]="column.getEditorSettings().getSingleColumn()"
                [step]="column.getEditorSettings().getTimeStep()"
                [twelveHoursFormat]="
                  column.getEditorSettings().getTwelveHoursFormat()
                "
                [withSeconds]="column.getEditorSettings().getShowSeconds()"
                [title]="column.getEditorSettings().getTimeText()"
                (onSelectTime)="onTimeChange(column, $event)"
              >
              </nb-timepicker>
            </nb-form-field>

            <nb-form-field *ngIf="datePickerTypes.DATE_RANGE">
              <input
                nbInput
                [placeholder]="column.getEditorSettings().getLabel()"
                [name]="column.getDataField()"
                [nbDatepicker]="dateTimeRangePicker"
                fullWidth
                #daterangepickerInput
                [(ngModel)]="newData[column.getDataField()]"
                [disabled]="
                  isNew ? !column.getAddable() : !column.getEditable()
                "
              />
              <button
                nbButton
                nbSuffix
                ghost
                status="primary"
                (click)="openDatepicker(daterangepickerInput)"
              >
                <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
              </button>
              <nb-rangepicker
                #dateTimeRangePicker
                format="{{ column.getEditorSettings().getFormat() }}"
                [filter]="column.getEditorSettings().getFilterDates()"
                (rangeChange)="onRangeChange(column, $event)"
                [showNavigation]="
                  column.getEditorSettings().getShowNavigation()
                "
                [showWeekNumber]="
                  column.getEditorSettings().getShowWeekNumbers()
                "
              >
              </nb-rangepicker>
            </nb-form-field>
          </ng-container>

          <nb-form-field
            *ngSwitchCase="editorTypes.TEXTAREA"
            class="textarea-container"
          >
            <textarea
              [name]="column.getDataField()"
              nbInput
              fullWidth
              [placeholder]="column.getEditorSettings().getLabel()"
              [(ngModel)]="newData[column.getDataField()]"
              [rows]="column.getEditorSettings().getRows()"
              [maxLength]="column.getEditorSettings().getMax()"
              (ngModelChange)="validatePopupForm()"
              [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            ></textarea>
            <div class="counter text-hint">
              {{
                newData[column.getDataField()]
                  ? newData[column.getDataField()].length
                  : 0
              }}/{{ column.getEditorSettings().getMax() }}
            </div>
          </nb-form-field>

          <input
            *ngSwitchCase="editorTypes.TEXTBOX"
            [type]="column.getEditorSettings().getTextboxType()"
            nbInput
            fullWidth
            [name]="column.getDataField()"
            [(ngModel)]="newData[column.getDataField()]"
            [placeholder]="column.getEditorSettings().getLabel()"
            [required]="column.getEditorSettings().getRequired()"
            [step]="column.getEditorSettings().getTimeStep()"
            [min]="column.getEditorSettings().getMin()"
            [max]="column.getEditorSettings().getMax()"
            (ngModelChange)="validatePopupForm()"
            (keypress)="onKeyPress(column, $event)"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
          />

          <input
            *ngSwitchCase="editorTypes.NUMBERBOX"
            [type]="'number'"
            nbInput
            fullWidth
            [name]="column.getDataField()"
            [(ngModel)]="newData[column.getDataField()]"
            [placeholder]="column.getEditorSettings().getLabel()"
            [required]="column.getEditorSettings().getRequired()"
            [step]="column.getEditorSettings().getTimeStep()"
            [min]="column.getEditorSettings().getMin()"
            [max]="column.getEditorSettings().getMax()"
            (ngModelChange)="validatePopupForm()"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
          />
          <div
            *ngSwitchCase="editorTypes.PROGRESSBAR"
            class="progressbar-container"
          >
            <nb-actions size="small">
              <nb-action icon="minus-outline"> </nb-action>
            </nb-actions>
            <nb-progress-bar
              [value]="newData[column.getDataField()]"
              [nbTooltip]="newData[column.getDataField()] + '%'"
            >
            </nb-progress-bar>
            <nb-actions size="small">
              <nb-action icon="plus-outline"> </nb-action>
            </nb-actions>
          </div>

          <ngx-colors
            *ngSwitchCase="editorTypes.COLORPICKER"
            [name]="column.getDataField()"
            ngx-colors-trigger
            [required]="column.getEditorSettings().getRequired()"
            [(ngModel)]="newData[column.getDataField()]"
            (ngModelChange)="validatePopupForm()"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
          ></ngx-colors>

          <ngx-tags-autocomplete
            *ngSwitchCase="editorTypes.AUTOCOMPLETE"
            [emptyPlaceholder]="column.getEditorSettings().getLabel()"
            [(selectedKeys)]="newData[column.getDataField()]"
            (onSelectionChanged)="validatePopupForm()"
            [keyAttribute]="column.getEditorSettings().getKeyExpression()"
            [displayArrow]="column.getEditorSettings().getDisplayArrow()"
            [attributesToFilter]="
              column.getEditorSettings().getAttributesToFilter()
            "
            [attributesToShow]="
              column.getEditorSettings().getAttributesToShow()
            "
            [attributesToShowInTag]="
              column.getEditorSettings().getAttributesToShowInTag()
            "
            [multiple]="column.getEditorSettings().getMultiple()"
            [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            [source]="column.getEditorSettings().getDataSource()"
          >
          </ngx-tags-autocomplete>
          <!--

    </div>
  </form>
</div>

<div class="popup-footer">
  <div class="row line"></div>
  <div class="row">
    <div class="d-flex justify-content-end p-3">
      <button
        nbButton
        ghost
        shape="round"
        class="me-2"
        (click)="onClickCancel()"
      >
        {{ cancelBtnText }}
      </button>
      <button
        nbButton
        #formSaveButton
        status="primary"
        shape="round"
        (click)="onClickSave()"
      >
        {{ saveBtnText }}
      </button>
    </div>
  </div>
</div>

<ng-template #titleTemplate>
  <div class="d-flex title-template">
    <nb-icon pack="eva" [icon]="icon" status="basic"></nb-icon>
    <div class="title">{{ title }}</div>
  </div>
</ng-template>
