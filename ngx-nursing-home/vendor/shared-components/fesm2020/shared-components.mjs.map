<nb-card class="progressbar-spinner-card" [nbSpinner]="loading" [nbSpinnerStatus]="status" [nbSpinnerSize]="size"
    [id]="id" *ngIf="loading" [nbSpinnerMessage]="message">
    <div class="progressbar-container h-100 w-100  m-0 row justify-content-center d-flex align-items-center">
        <div [ngClass]="progressbarSize">
            <nb-progress-bar class="progress-margin" [displayValue]="displayValue" [value]="value" [status]="status">
            </nb-progress-bar>
        </div>
    </div>
</nb-card>
