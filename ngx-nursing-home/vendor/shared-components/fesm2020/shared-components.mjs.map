<div *ngIf="column.getEditorSettings().getShow()">
  <ng-container [ngSwitch]="column.getEditor()">
    <div *ngSwitchCase="types.TEXTBOX">
      <input
        [(ngModel)]="cellValue"
        name="inputFilter"
        nbInput
        fullWidth
        [placeholder]="column.getTitle()"
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
      />
    </div>

    <div *ngSwitchCase="types.SELECT">
      <nb-select
        [placeholder]="column.getTitle()"
        fullWidth
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
        [(selected)]="cellValue"
        name="selectFilter"
      >
        <nb-option [value]="null">{{
          column.getEditorSettings().getClearText()
        }}</nb-option>
        <nb-option
          *ngFor="let o of selectFilterDataSource"
          [value]="o[column.getEditorSettings().getKeyExpression()]"
        >
          {{ o[column.getEditorSettings().getDisplayExpression()] }}
        </nb-option>
      </nb-select>
    </div>

    <div *ngSwitchCase="types.NUMBERBOX">
      <input
        nbInput
        type="number"
        fullWidth
        [placeholder]="column.getTitle()"
        [(ngModel)]="cellValue"
        name="numberboxFilter"
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
      />
    </div>

    <div *ngSwitchCase="types.DATE_PICKER">
      <ng-container [ngSwitch]="column.getEditorSettings().getDatePickerType()">
        <div *ngSwitchCase="datePickerTypes.DATE">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbDatepicker]="datePicker"
              fullWidth
              #datepickerInput
              [(ngModel)]="cellValue"
              name="datePickerFilter"
              [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="datepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
            <nb-datepicker
              #datePicker
              format="{{ column.getEditorSettings().getFormat() }}"
              [filter]="column.getEditorSettings().getFilterDates()"
              [showNavigation]="column.getEditorSettings().getShowNavigation()"
              [showWeekNumber]="column.getEditorSettings().getShowWeekNumbers()"
              [max]="column.getEditorSettings().getMax()"
              [min]="column.getEditorSettings().getMin()"
            >
            </nb-datepicker>
          </nb-form-field>
        </div>

        <div *ngSwitchCase="datePickerTypes.DATE_TIME">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbDatepicker]="dateTimePicker"
              fullWidth
              #dateTimepickerInput
              [(ngModel)]="cellValue"
              name="dateTimePickerFilter"
              [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="dateTimepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
            <nb-date-timepicker
              #dateTimePicker
              format="{{ column.getEditorSettings().getFormat() }}"
              [filter]="column.getEditorSettings().getFilterDates()"
              [showNavigation]="column.getEditorSettings().getShowNavigation()"
              [showWeekNumber]="column.getEditorSettings().getShowWeekNumbers()"
              [max]="column.getEditorSettings().getMax()"
              [min]="column.getEditorSettings().getMin()"
              [singleColumn]="column.getEditorSettings().getSingleColumn()"
              [step]="column.getEditorSettings().getTimeStep()"
              [withSeconds]="column.getEditorSettings().getShowSeconds()"
              [twelweHoursFormat]="
                column.getEditorSettings().getTwelveHoursFormat()
              "
              [applyButtonText]="
                column.getEditorSettings().getApplyButtonText()
              "
              [currentTimeButtonText]="
                column.getEditorSettings().getCurrentTimeButtonText()
              "
              [showCurrentTimeButton]="
                column.getEditorSettings().getShowCurrentTimeButton()
              "
            >
            </nb-date-timepicker>
          </nb-form-field>
        </div>

        <div *ngSwitchCase="datePickerTypes.TIME">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbTimepicker]="timePicker"
              fullWidth
              #timepickerInput
              [(ngModel)]="cellValue"
              name="timepickerFilter"
              [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="timepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="clock-outline"></nb-icon>
            </button>
            <nb-timepicker
              #timePicker
              timeFormat="{{ column.getEditorSettings().getFormat() }}"
              [ampmText]="column.getEditorSettings().getTimeText()"
              [applyButtonText]="
                column.getEditorSettings().getApplyButtonText()
              "
              [currentTimeButtonText]="
                column.getEditorSettings().getCurrentTimeButtonText()
              "
              [hoursText]="column.getEditorSettings().getHoursText()"
              [minutesText]="column.getEditorSettings().getMinutesText()"
              [secondsText]="column.getEditorSettings().getSecondsText()"
              [singleColumn]="column.getEditorSettings().getSingleColumn()"
              [step]="column.getEditorSettings().getTimeStep()"
              [twelveHoursFormat]="
                column.getEditorSettings().getTwelveHoursFormat()
              "
              [withSeconds]="column.getEditorSettings().getShowSeconds()"
            >
            </nb-timepicker>
          </nb-form-field>
        </div>

        <div *ngSwitchCase="datePickerTypes.DATE_RANGE">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbDatepicker]="dateTimeRangePicker"
              fullWidth
              #dateRangepickerInput
              [(ngModel)]="cellValue"
              name="daterangePickerFilter"
              [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="dateRangepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
            <nb-rangepicker
              #dateTimeRangePicker
              format="{{ column.getEditorSettings().getFormat() }}"
              [filter]="column.getEditorSettings().getFilterDates()"
              [showNavigation]="column.getEditorSettings().getShowNavigation()"
              [showWeekNumber]="column.getEditorSettings().getShowWeekNumbers()"
              [max]="column.getEditorSettings().getMax()"
              [min]="column.getEditorSettings().getMin()"
            >
            </nb-rangepicker>
          </nb-form-field>
        </div>
      </ng-container>
    </div>

    <div
      *ngSwitchCase="types.CHECKBOX"
      class="d-flex justify-content-center align-items-center"
    >
      <nb-checkbox
        name="checkboxFilter"
        [(checked)]="cellValue"
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
      >
      </nb-checkbox>
    </div>

    <div *ngSwitchCase="types.TOGGLE">
      <nb-toggle
        name="toggleFilter"
        [(checked)]="cellValue"
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
      ></nb-toggle>
    </div>

    <div *ngSwitchCase="types.COLORPICKER">
      <ngx-colors
        [name]="column.getDataField()"
        ngx-colors-trigger
        [required]="column.getEditorSettings().getRequired()"
        [(ngModel)]="cellValue"
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
      ></ngx-colors>
    </div>

    <div *ngSwitchCase="types.AUTOCOMPLETE">
      <ngx-tags-autocomplete
        [emptyPlaceholder]="column.getEditorSettings().getLabel()"
        [(selectedKeys)]="cellValue"
        [keyAttribute]="column.getEditorSettings().getKeyExpression()"
        [displayArrow]="column.getEditorSettings().getDisplayArrow()"
        [attributesToFilter]="
          column.getEditorSettings().getAttributesToFilter()
        "
        [attributesToShow]="column.getEditorSettings().getAttributesToShow()"
        [attributesToShowInTag]="
          column.getEditorSettings().getAttributesToShowInTag()
        "
        [multiple]="column.getEditorSettings().getMultiple()"
        [disabled]="isNew ? !column.getAddable() : !column.getEditable()"
        [source]="column.getEditorSettings().getDataSource()"
      >
      </ngx-tags-autocomplete>
    </div>

    <div
      *ngSwitchCase="types.ACTION"
      class="d-flex justify-content-center align-items-center"
    >
      <div
        *ngFor="let btn of column.getEditorSettings().getButtons()"
        style="width: max-content"
      >
        <button
          nbButton
          [shape]="btn.getShape()"
          [ghost]="btn.getGhost()"
          [size]="btn.getSize()"
          [status]="btn.getStatus()"
          [outline]="btn.getOutlined()"
          [disabled]="btn.getDisabled()"
          [class]="btn.getClass()"
          [id]="btn.getId()"
          [hero]="btn.getHero()"
          [nbTooltip]="btn.getTooltip()"
          [nbTooltipDisabled]="btn.getTooltipDisabled()"
          [filled]="btn.getFilled()"
          (click)="onButtonClick(btn)"
        >
          <span *ngIf="btn.getText() != ''">{{ btn.getText() }}</span>
          <nb-icon
            *ngIf="btn.getIcon() != ''"
            pack="eva"
            [icon]="btn.getIcon()"
          ></nb-icon>
        </button>
      </div>
    </div>
  </ng-container>
</div>
