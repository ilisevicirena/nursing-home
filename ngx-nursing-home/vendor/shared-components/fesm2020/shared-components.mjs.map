<div
  class="ngx-tag"
  [ngClass]="shape + ' status-' + color + ' appearance-' + appearance + ' '"
  [style.background-color]="appearance == 'outline' ? hexToRgbA(color) : color"
  [style.color]="appearance == 'outline' ? color : ''"
  [style.border-color]="color"
>
  <i [class]="icon" *ngIf="!isEvaIcon && icon"></i>
  <nb-icon *ngIf="isEvaIcon && icon" pack="eva" [icon]="icon"></nb-icon>
  {{ text }}
</div>
