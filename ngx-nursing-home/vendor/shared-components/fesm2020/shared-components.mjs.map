<div class="ngx-grid-footer row m-0" *ngIf="visible">
  <div class="col p-0">
    <pagination-template #pT="paginationApi" (pageChange)="page = $event">
      <button
        nbButton
        size="small"
        status="primary"
        shape="round"
        ghost
        class="pagination-previous"
        [disabled]="pT.isFirstPage()"
        *ngIf="!pT.isFirstPage()"
        (click)="pT.previous(); onPageChanged()"
      >
        <nb-icon pack="eva" icon="chevron-left-outline"></nb-icon>
      </button>

      <button
        nbButton
        size="small"
        [ghost]="pT.getCurrent() != page.value"
        *ngFor="let page of pT.pages"
        [status]="pT.getCurrent() === page.value ? 'primary' : 'basic'"
        (click)="pT.setCurrent(page.value); onPageChanged()"
      >
        {{ page.label }}
      </button>

      <button
        ghost
        size="small"
        status="primary"
        nbButton
        shape="round"
        class="pagination-next"
        [disabled]="pT.isLastPage()"
        *ngIf="!pT.isLastPage()"
        (click)="pT.next(); onPageChanged()"
      >
        <nb-icon pack="eva" icon="chevron-right-outline"></nb-icon>
      </button>
    </pagination-template>
  </div>

  <div
    class="col p-0 d-flex justify-content-end align-items-center actions-container"
  >
    <div *ngIf="refreshEnabled">
      <button
        nbButton
        status="primary"
        ghost
        shape="round"
        [nbTooltip]="refreshTooltip"
        [nbTooltipDisabled]="refreshTooltip.length == 0"
        (click)="onClickResetFilters()"
      >
        <nb-icon pack="eva" icon="refresh-outline"></nb-icon>
      </button>
    </div>
    <div *ngIf="exportPdfEnabled">
      <button
        nbButton
        status="primary"
        ghost
        shape="round"
        [nbTooltip]="exportPdfTooltip"
        [nbTooltipDisabled]="exportPdfTooltip.length == 0"
        (click)="exportPdfBtnClick()"
      >
        <i class="far fa-file-pdf"></i>
      </button>
    </div>
    <div *ngIf="exportExcelEnabled">
      <button
        nbButton
        status="primary"
        ghost
        shape="round"
        [nbTooltip]="exportExcelTooltip"
        [nbTooltipDisabled]="exportExcelTooltip.length == 0"
        (click)="exportExcelBtnClick()"
      >
        <i class="far fa-file-excel"></i>
      </button>
    </div>
    <div id="entries-per-page" *ngIf="entriesPerPageEnabled">
      <nb-select
        [nbTooltip]="entriesPerPageTooltip"
        [nbTooltipDisabled]="entriesPerPageTooltip.length == 0"
        [(ngModel)]="defaultPerPageOption"
        (selectedChange)="onSelectedChangePagerPerPage($event)"
      >
        <nb-option
          *ngFor="let option of entriesPerPageOptions"
          [value]="option"
          >{{ option }}</nb-option
        >
      </nb-select>
    </div>
  </div>
</div>
