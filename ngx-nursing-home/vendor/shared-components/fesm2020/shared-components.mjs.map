<div *ngIf="column.getFilterSettings().getShow()">
  <ng-container [ngSwitch]="column.getFilter()">
    <div *ngSwitchCase="types.TEXTBOX">
      <input
        [(ngModel)]="value"
        name="inputFilter"
        nbInput
        fullWidth
        [placeholder]="column.getTitle()"
        autocomplete="off"
        (ngModelChange)="onFilterChanged()"
      />
    </div>

    <div *ngSwitchCase="types.SELECT">
      <nb-select
        [placeholder]="column.getTitle()"
        fullWidth
        [(selected)]="value"
        name="selectFilter"
        (selectedChange)="onFilterChanged()"
      >
        <nb-option [value]="null">{{
          column.getFilterSettings().getClearText()
        }}</nb-option>
        <nb-option
          *ngFor="let o of selectFilterDataSource"
          [value]="o[column.getFilterSettings().getKeyExpression()]"
        >
          {{ o[column.getFilterSettings().getDisplayExpression()] }}
        </nb-option>
      </nb-select>
    </div>

    <div *ngSwitchCase="types.NUMBERBOX">
      <input
        nbInput
        type="number"
        fullWidth
        [placeholder]="column.getTitle()"
        [(ngModel)]="value"
        name="numberboxFilter"
        (ngModelChange)="onFilterChanged()"
      />
    </div>

    <div *ngSwitchCase="types.DATE_PICKER">
      <ng-container [ngSwitch]="column.getFilterSettings().getDatePickerType()">
        <div *ngSwitchCase="datePickerTypes.DATE">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbDatepicker]="datePicker"
              fullWidth
              #datepickerInput
              [(ngModel)]="value"
              (ngModelChange)="onFilterChanged()"
              name="datePickerFilter"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="datepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
            <nb-datepicker
              #datePicker
              format="{{ column.getFilterSettings().getFormat() }}"
              [filter]="column.getFilterSettings().getFilterDates()"
              [showNavigation]="column.getFilterSettings().getShowNavigation()"
              [showWeekNumber]="column.getFilterSettings().getShowWeekNumbers()"
              [max]="column.getFilterSettings().getMax()"
              [min]="column.getFilterSettings().getMin()"
            >
            </nb-datepicker>
          </nb-form-field>
        </div>

        <div *ngSwitchCase="datePickerTypes.DATE_TIME">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbDatepicker]="dateTimePicker"
              fullWidth
              #dateTimepickerInput
              [(ngModel)]="value"
              name="dateTimePickerFilter"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="dateTimepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
            <nb-date-timepicker
              #dateTimePicker
              format="{{ column.getFilterSettings().getFormat() }}"
              [filter]="column.getFilterSettings().getFilterDates()"
              [showNavigation]="column.getFilterSettings().getShowNavigation()"
              [showWeekNumber]="column.getFilterSettings().getShowWeekNumbers()"
              [max]="column.getFilterSettings().getMax()"
              [min]="column.getFilterSettings().getMin()"
              [singleColumn]="column.getFilterSettings().getSingleColumn()"
              [step]="column.getFilterSettings().getTimeStep()"
              [withSeconds]="column.getFilterSettings().getShowSeconds()"
              [twelweHoursFormat]="
                column.getFilterSettings().getTwelveHoursFormat()
              "
              [applyButtonText]="
                column.getFilterSettings().getApplyButtonText()
              "
              [currentTimeButtonText]="
                column.getFilterSettings().getCurrentTimeButtonText()
              "
              [showCurrentTimeButton]="
                column.getFilterSettings().getShowCurrentTimeButton()
              "
              (dateChange)="onFilterChanged()"
            >
            </nb-date-timepicker>
          </nb-form-field>
        </div>

        <div *ngSwitchCase="datePickerTypes.TIME">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbTimepicker]="timePicker"
              fullWidth
              #timepickerInput
              [(ngModel)]="value"
              name="timepickerFilter"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="timepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="clock-outline"></nb-icon>
            </button>
            <nb-timepicker
              #timePicker
              timeFormat="{{ column.getFilterSettings().getFormat() }}"
              [ampmText]="column.getFilterSettings().getTimeText()"
              [applyButtonText]="
                column.getFilterSettings().getApplyButtonText()
              "
              [currentTimeButtonText]="
                column.getFilterSettings().getCurrentTimeButtonText()
              "
              [hoursText]="column.getFilterSettings().getHoursText()"
              [minutesText]="column.getFilterSettings().getMinutesText()"
              [secondsText]="column.getFilterSettings().getSecondsText()"
              [singleColumn]="column.getFilterSettings().getSingleColumn()"
              [step]="column.getFilterSettings().getTimeStep()"
              [twelveHoursFormat]="
                column.getFilterSettings().getTwelveHoursFormat()
              "
              [withSeconds]="column.getFilterSettings().getShowSeconds()"
              (onSelectTime)="onFilterChanged()"
            >
            </nb-timepicker>
          </nb-form-field>
        </div>

        <div *ngSwitchCase="datePickerTypes.DATE_RANGE">
          <nb-form-field>
            <input
              nbInput
              [placeholder]="column.getTitle()"
              [nbDatepicker]="dateTimeRangePicker"
              fullWidth
              #dateRangepickerInput
              [(ngModel)]="value"
              name="daterangePickerFilter"
              (ngModelChange)="rangePickerModelChange($event)"
            />
            <button
              nbButton
              nbSuffix
              ghost
              status="primary"
              (click)="dateRangepickerInput.focus()"
            >
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
            <nb-rangepicker
              #dateTimeRangePicker
              format="{{ column.getFilterSettings().getFormat() }}"
              [filter]="column.getFilterSettings().getFilterDates()"
              [showNavigation]="column.getFilterSettings().getShowNavigation()"
              [showWeekNumber]="column.getFilterSettings().getShowWeekNumbers()"
              [max]="column.getFilterSettings().getMax()"
              [min]="column.getFilterSettings().getMin()"
              (rangeChange)="onRangeChange($event)"
            >
            </nb-rangepicker>
          </nb-form-field>
        </div>
      </ng-container>
    </div>

    <div
      *ngSwitchCase="types.CHECKBOX"
      class="d-flex justify-content-center align-items-center"
    >
      <nb-checkbox
        name="checkboxFilter"
        [(checked)]="value"
        (checkedChange)="onFilterChanged()"
      >
      </nb-checkbox>
    </div>

    <div *ngSwitchCase="types.TOGGLE">
      <nb-toggle
        name="toggleFilter"
        [(checked)]="value"
        (checkedChange)="onFilterChanged()"
      ></nb-toggle>
    </div>
  </ng-container>
</div>
