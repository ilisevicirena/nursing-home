<div class="h-100 overflow-auto position-relative">
  <ngx-schedule
    [(events)]="events"
    (yearSelectionChanged)="onYearSelectionChange($event)"
    [showAddNewBtn]="true"
    (addNewClicked)="onAddNewClick()"
    (todayClicked)="onTodayClicked()"
    (monthSelectionChanged)="onMonthSelectionChange($event)"
    (eventClicked)="onEventClicked($event)"
  >
  </ngx-schedule>
</div>
