<nb-card class="h-100">
    <nb-card-header>
        {{getString('packagesManagement')}}
    </nb-card-header>
    <nb-card-body>
        <div style="height: 550px;">
            <ngx-smart-table [columns]="packagesColumns" [(data)]="packagesData" tableMode="external"
                (createStarted)="onCreateStarted()" (editStarted)="onEditStarted($event)"
                (deleteStarted)="onDeleteStarted($event)" [defaultPerPageOption]="20"></ngx-smart-table>
        </div>
    </nb-card-body>
</nb-card>
