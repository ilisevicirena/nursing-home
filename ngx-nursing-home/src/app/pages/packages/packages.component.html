<nb-card class="h-100">
    <nb-card-header>
        {{getString('packagesManagement')}}
    </nb-card-header>
    <nb-card-body>
        <div class="h-100">
            <ngx-smart-table [columns]="packagesColumns" [(data)]="packagesData" tableMode="external"
                [exportSettings]="exportSettings" (createStarted)="onCreateStarted()"
                (editStarted)="onEditStarted($event)" (deleteStarted)="onDeleteStarted($event)"
                [defaultPerPageOption]="20"></ngx-smart-table>
        </div>
    </nb-card-body>
</nb-card>
