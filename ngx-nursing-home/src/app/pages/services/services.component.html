<nb-card class="h-100">
  <nb-card-header>
    {{ getString("servicesSingle") }}
  </nb-card-header>
  <nb-card-body>
    <div class="h-100">
      <ngx-grid
        [columns]="servicesColumns"
        [(data)]="servicesData"
        gridMode="external"
        [exportSettings]="exportSettings"
        [selectionEnabled]="false"
        (createStarted)="onCreateStarted()"
        (editStarted)="onEditStarted($event)"
        (deleteStarted)="onDeleteStarted($event)"
        [defaultPerPageOption]="20"
        [exportPdfTooltip]="getString('exportPdfTooltip')"
        [exportExcelTooltip]="getString('exportExcelTooltip')"
        [entriesPerPageTooltip]="getString('entriesPerPageTooltip')"
        [refreshTooltip]="getString('refreshTooltip')"
        [addTooltip]="getString('addTooltip')"
      ></ngx-grid>
    </div>
  </nb-card-body>
</nb-card>
