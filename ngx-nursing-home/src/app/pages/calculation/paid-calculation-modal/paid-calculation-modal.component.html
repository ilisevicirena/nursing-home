<nb-card class="event-card">
  <nb-card-header class="d-flex">
    <div class="col">
      <div class="row m-0 p-0 align-items-center">
        {{ getString("paidPriceModalTitle") }}<br />
      </div>
    </div>
    <div class="w-max">
      <button nbButton ghost shape="round" (click)="close(false)">
        <nb-icon pack="eva" icon="close-outline"></nb-icon>
      </button>
    </div>
  </nb-card-header>
  <nb-card-body class="pt-0">
    <div class="row">
      <div class="form-group">
        <div class="label">
          {{ getString("realPrice") }}
          <nb-icon
            pack="eva"
            icon="alert-circle-outline"
            status="danger"
            size="small"
            class="ms-1 required-mark"
            [nbTooltip]="getString('required')"
          ></nb-icon>
        </div>
        <div class="value">
          <input
            nbInput
            [(ngModel)]="realPrice"
            fullWidth
            name="price"
            type="number"
            [placeholder]="getString('realPrice')"
            autocomplete="off"
            (focusout)="onPriceChange()"
          />
        </div>
      </div>
    </div>
    <div class="row mt-2">
      <div class="form-group">
        <div class="label">
          {{ getString("paidPrice") }}
          <nb-icon
            pack="eva"
            icon="alert-circle-outline"
            status="danger"
            size="small"
            class="ms-1 required-mark"
            [nbTooltip]="getString('required')"
          ></nb-icon>
        </div>
        <div class="value">
          <input
            nbInput
            [(ngModel)]="paidPrice"
            fullWidth
            name="price"
            type="number"
            [placeholder]="getString('paidPrice')"
            autocomplete="off"
            (focusout)="onPriceChange(false)"
          />
        </div>
      </div>
    </div>
    <div class="row mt-2">
      <div class="form-group">
        <div class="label">
          {{ getString("paidDate") }}
          <nb-icon
            pack="eva"
            icon="alert-circle-outline"
            status="danger"
            size="small"
            class="ms-1 required-mark"
            [nbTooltip]="getString('required')"
          ></nb-icon>
        </div>
        <div class="value">
          <nb-form-field>
            <input
              nbInput
              #DateInput
              [placeholder]="getString('paidDate')"
              fullWidth
              autocomplete="off"
              name="paidDate"
              [(ngModel)]="paidDate"
              [nbDatepicker]="DateDatepicker"
            />
            <nb-datepicker #DateDatepicker></nb-datepicker>
            <button nbButton nbSuffix ghost (click)="DateInput.focus()">
              <nb-icon pack="eva" icon="calendar-outline"></nb-icon>
            </button>
          </nb-form-field>
        </div>
      </div>
    </div>
    <div class="row mt-2">
      <div class="form-group">
        <div class="label">{{ getString("uploadDocument") }}</div>
        <div class="value">
          <ngx-filepicker
            class="h-100"
            [multiple]="false"
            [showMaxFilesNumber]="true"
            [maxFiles]="1"
            [showAcceptedFormats]="true"
            [displayFileSize]="true"
            (valueChanged)="onFileUploaded($event)"
            [accept]="'.pdf, .doc, .docx, .xls, .xlsx, .txt, .png, .jpg, .jpeg'"
          ></ngx-filepicker>
        </div>
      </div>
    </div>
  </nb-card-body>
  <nb-card-footer class="d-flex justify-content-end">
    <button
      nbButton
      ghost
      shape="round"
      size="small"
      class="me-2"
      (click)="close(false)"
    >
      {{ getString("cancel") }}
    </button>
    <button
      nbButton
      status="primary"
      shape="round"
      size="small"
      [disabled]="!realPrice || !paidPrice || !paidDate"
      (click)="onSaveClick()"
    >
      {{ getString("save") }}
    </button>
  </nb-card-footer>
</nb-card>
