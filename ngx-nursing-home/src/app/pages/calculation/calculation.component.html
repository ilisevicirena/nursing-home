<div class="row m-0 h-100 w-100">
    <div class="col-md-10 ps-0 h-100">
        <nb-card class="h-100 m-0 calculation-card">
            <nb-card-header>
                {{getString('calculationFor')}}
                <nb-select [(selected)]="month" (selectedChange)="refreshData()">
                    <nb-option *ngFor="let m of months" [value]="m.key">{{m.name}}</nb-option>
                </nb-select>
                <nb-select [(selected)]="year" (selectedChange)="refreshData()">
                    <nb-option *ngFor="let y of years" [value]="y">{{y}}</nb-option>
                </nb-select>
            </nb-card-header>
            <nb-card-body>
                <div style="height: 500px;">
                    <ngx-smart-table [columns]="columns" [(data)]="calculations" [addEnabled]="false"
                        [loadingEnabled]="false" [editEnabled]="false" [deleteEnabled]="false" [selectionEnabled]="true"
                        [selectRowByClick]="true" [selctionModeMultiple]=" true"
                        [defaultPerPageOption]="10"></ngx-smart-table>
                </div>
            </nb-card-body>
        </nb-card>
    </div>
    <div class="col-md-2 h-100 pe-0 ps-0">
        <nb-card class="chart-card">
            <nb-card-body>
                <div class="row m-0 position-relative align-items-center" style="height: 100px;">
                    <div class="info" style="width: 60%;">
                        <div class="value fw-600 d-flex justify-content-center">7 osoba</div>
                        <div class="details subtitle-2"><span>obračunato od</span> 7 </div>
                    </div>
                    <div echarts [options]="options" class="echart">
                    </div>
                </div>
            </nb-card-body>
        </nb-card>
    </div>
</div>
