<nb-card class="h-100">
  <nb-card-header>
    {{ getString("categories") }}
  </nb-card-header>
  <nb-card-body>
    <ngx-grid
      [columns]="columns"
      [(data)]="data"
      [selectionEnabled]="false"
      [addEnabled]="false"
      [editEnabled]="false"
      [deleteEnabled]="false"
    ></ngx-grid>
  </nb-card-body>
</nb-card>
