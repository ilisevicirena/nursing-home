<sample-user-dashboard
  *ngIf="checkUserHasRole(userRoles.USER)"
></sample-user-dashboard>
<sample-admin-dashboard
  *ngIf="checkUserHasRole(userRoles.ADMIN)"
></sample-admin-dashboard>
<sample-employee-dashboard
  *ngIf="
    checkUserHasRole(userRoles.NURSE) ||
    checkUserHasRole(userRoles.DOCTOR) ||
    checkUserHasRole(userRoles.CAREGIVER)
  "
></sample-employee-dashboard>
