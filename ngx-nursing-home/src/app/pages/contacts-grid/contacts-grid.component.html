<ngx-grid
  [(data)]="contactsData"
  [columns]="contactsColumns"
  (editConfirm)="contactsEdit($event)"
  (deleteConfirm)="contactsDelete($event)"
  [exportExcelEnabled]="true"
  [(exportSettings)]="exportSettings"
  [defaultPerPageOption]="10"
  [exportPdfEnabled]="true"
  [pagerEnabled]="true"
  [entriesPerPageEnabled]="true"
  [refreshEnabled]="true"
  [gridMode]="gridMode"
  [selectionEnabled]="false"
  (createConfirm)="onCreateConfirm($event)"
  [exportPdfTooltip]="getString('exportPdfTooltip')"
  [exportExcelTooltip]="getString('exportExcelTooltip')"
  [entriesPerPageTooltip]="getString('entriesPerPageTooltip')"
  [refreshTooltip]="getString('refreshTooltip')"
  [addTooltip]="getString('addTooltip')"
></ngx-grid>
