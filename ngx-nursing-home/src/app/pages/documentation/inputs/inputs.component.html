<div class="mt-3">
    <nb-list>
        <nb-list-item *ngFor="let item of items">
            <strong>{{item.title}}</strong>
            <nb-icon pack="eva" icon="arrow-forward-outline" class="ms-3 me-3"></nb-icon>
            {{item.description}}
            <div *ngIf="item.hasWarning">
                <nb-icon pack="eva" icon="alert-triangle-outline" status="danger" class="ms-3 me-3">
                </nb-icon>
                <span class="text-danger">{{item.warning}}</span>
            </div>
            <div *ngIf="item.canBeUndefined">
                <nb-icon pack="eva" icon="alert-circle-outline" status="info" class="ms-3 me-3">
                </nb-icon>
                <span class="text-info">Može biti undefined</span>
            </div>
        </nb-list-item>
        <nb-list-item *ngIf="items.length==0">Nema</nb-list-item>
    </nb-list>
</div>
