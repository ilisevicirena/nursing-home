<nb-card class="h-100">
  <nb-card-header>
    {{ getString("municipalities") }}
  </nb-card-header>
  <nb-card-body>
    <ngx-grid
      [columns]="columns"
      [(data)]="data"
      gridMode="popup"
      [selectionEnabled]="false"
      (createConfirm)="createConfirm($event)"
      (editConfirm)="editConfirm($event)"
      (deleteConfirm)="deleteConfirm($event)"
    ></ngx-grid>
  </nb-card-body>
</nb-card>
