<nb-card class="h-100">
    <nb-card-header>
        {{getString('discounts')}}
    </nb-card-header>
    <nb-card-body>
        <div class="h-100">
            <ngx-smart-table [columns]="discountsColumns" [(data)]="discountsData" tableMode="external"
                [exportSettings]="exportSettings" (createStarted)="onCreateStarted()" [editEnabled]="false"
                (deleteStarted)="onDeleteStarted($event)" [loadingEnabled]="false"
                [defaultPerPageOption]="20"></ngx-smart-table>
        </div>
    </nb-card-body>
</nb-card>
