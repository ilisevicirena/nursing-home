<nb-card class="h-100">
  <nb-card-header>
    {{ getString("discounts") }}
  </nb-card-header>
  <nb-card-body>
    <div class="h-100">
      <ngx-grid
        [columns]="discountsColumns"
        [(data)]="discountsData"
        gridMode="external"
        [exportSettings]="exportSettings"
        (createStarted)="onCreateStarted()"
        [editEnabled]="false"
        [selectionEnabled]="false"
        (deleteStarted)="onDeleteStarted($event)"
        [loadingEnabled]="false"
        [defaultPerPageOption]="20"
      ></ngx-grid>
    </div>
  </nb-card-body>
</nb-card>
