<div id="login-container">
  <div class="row h-100">
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div
        class="success-message col-md-7 col-sm-12"
        *ngIf="showSuccessMessage"
      >
        <nb-icon
          pack="eva"
          status="info"
          icon="checkmark-circle-outline"
        ></nb-icon>
        <div class="message">
          {{ getString("resetPasswordRedirectMessage") }}
        </div>
        <div class="spinner-container">
          <nb-spinner
            size="giant"
            status="info"
            [loading]="true"
            message=""
          ></nb-spinner>
        </div>
      </div>
      <div class="login-card col-md-7 col-sm-12" *ngIf="!showSuccessMessage">
        <nb-spinner
          *ngIf="loading"
          size="giant"
          status="primary"
          message=""
        ></nb-spinner>
        <div class="d-flex align-items-center mb-2">
          <img class="logo" src="assets/images/logo.png" />
          <div class="brand-name ms-2">{{ brandName }}</div>
        </div>
        <div class="row mb-3">
          <div class="title mb-3">{{ getString("changePassword") }}</div>
        </div>
        <div class="mt-3">
          <div class="form-group mt-3">
            <div class="label">
              {{ getString("oldPassword") }}
              <nb-icon
                pack="eva"
                icon="alert-circle-outline"
                status="danger"
                size="small"
                class="ms-1 required-mark"
                [nbTooltip]="getString('required')"
              ></nb-icon>
            </div>
            <div class="value">
              <nb-form-field>
                <input
                  nbInput
                  shape="round"
                  [placeholder]="getString('oldPassword')"
                  [type]="getOldPasswordInputType()"
                  name="oldPassword"
                  [(ngModel)]="oldPassword"
                  [status]="getOldPasswordStatus()"
                  fullWidth
                />
                <button
                  type="button"
                  shape="round"
                  status="primary"
                  nbSuffix
                  nbButton
                  ghost
                  (click)="toggleShowOldPassword()"
                >
                  <nb-icon
                    [icon]="showOldPassword ? 'eye-outline' : 'eye-off-outline'"
                    pack="eva"
                  >
                  </nb-icon>
                </button>
              </nb-form-field>
            </div>
            <div class="form-group mt-3">
              <div class="label">
                {{ getString("newPassword") }}
                <nb-icon
                  pack="eva"
                  icon="alert-circle-outline"
                  status="danger"
                  size="small"
                  class="ms-1 required-mark"
                  [nbTooltip]="getString('required')"
                ></nb-icon>
              </div>
              <div class="value">
                <nb-form-field>
                  <input
                    nbInput
                    shape="round"
                    [placeholder]="getString('newPassword')"
                    [type]="getNewPasswordInputType()"
                    name="newPassword"
                    [(ngModel)]="newPassword"
                    [status]="getNewPasswordStatus()"
                    fullWidth
                  />
                  <button
                    type="button"
                    shape="round"
                    status="primary"
                    nbSuffix
                    nbButton
                    ghost
                    (click)="toggleShowNewPassword()"
                  >
                    <nb-icon
                      [icon]="
                        showNewPassword ? 'eye-outline' : 'eye-off-outline'
                      "
                      pack="eva"
                    >
                    </nb-icon>
                  </button>
                </nb-form-field>
              </div>
              <div class="form-group mt-3">
                <div class="label">
                  {{ getString("retypePassword") }}
                  <nb-icon
                    pack="eva"
                    icon="alert-circle-outline"
                    status="danger"
                    size="small"
                    class="ms-1 required-mark"
                    [nbTooltip]="getString('required')"
                  ></nb-icon>
                </div>
                <div class="value">
                  <nb-form-field>
                    <input
                      nbInput
                      shape="round"
                      [placeholder]="getString('retypePassword')"
                      [type]="getRetypedPasswordInputType()"
                      name="retypedPassword"
                      [(ngModel)]="retypedPassword"
                      [status]="getRetypedPasswordStatus()"
                      fullWidth
                    />
                    <button
                      type="button"
                      shape="round"
                      status="primary"
                      nbSuffix
                      nbButton
                      ghost
                      (click)="toggleShowRetypedPassword()"
                    >
                      <nb-icon
                        [icon]="
                          showRetypedPassword
                            ? 'eye-outline'
                            : 'eye-off-outline'
                        "
                        pack="eva"
                      >
                      </nb-icon>
                    </button>
                  </nb-form-field>
                  <div
                    class="invalid-message"
                    *ngIf="newPassword != retypedPassword"
                  >
                    {{ getString("retypedPasswordInvalid") }}
                  </div>
                </div>
              </div>
            </div>
            <div class="row mt-3">
              <button
                class="mt-3"
                nbButton
                shape="round"
                status="primary"
                (click)="resetPasswordClick()"
              >
                {{ getString("resetPassword") }}
              </button>
            </div>
            <div class="row">
              <button
                class="mt-3"
                nbButton
                ghost
                shape="round"
                status="primary"
                (click)="cancel()"
              >
                {{ getString("cancel") }}
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
