<div id="login-container">
  <div class="row h-100">
    <div class="col-md-6 d-flex align-items-center justify-content-center">
      <div
        class="success-message col-md-7 col-sm-12"
        *ngIf="showSuccessMessage"
      >
        <nb-icon
          pack="eva"
          status="info"
          icon="checkmark-circle-outline"
        ></nb-icon>
        <div class="message">
          {{ getString("forgotPasswordRedirectMessage") }}
        </div>
        <div class="spinner-container">
          <nb-spinner
            size="giant"
            status="info"
            [loading]="true"
            message=""
          ></nb-spinner>
        </div>
      </div>
      <div *ngIf="!showSuccessMessage" class="login-card col-md-7 col-sm-12">
        <nb-spinner
          *ngIf="loading"
          size="giant"
          status="primary"
          message=""
        ></nb-spinner>
        <div class="d-flex align-items-center mb-2">
          <img class="logo" src="assets/images/logo.png" />
          <div class="brand-name ms-2">{{ brandName }}</div>
        </div>
        <div class="row mb-3">
          <div class="title mb-3">{{ getString("forgotPassword") }}</div>
        </div>
        <div class="reset-password-notice">
          <nb-icon
            pack="eva"
            icon="alert-triangle-outline"
            status="info"
          ></nb-icon>
          <div>{{ getString("forgotPasswordNotice") }}</div>
        </div>
        <div class="mt-3">
          <div class="form-group">
            <div class="label">
              {{ getString("email") }}
              <nb-icon
                pack="eva"
                icon="alert-circle-outline"
                status="danger"
                size="small"
                class="ms-1 required-mark"
                [nbTooltip]="getString('required')"
              ></nb-icon>
            </div>
            <div class="value">
              <input
                nbInput
                autocomplete="off"
                shape="round"
                [placeholder]="getString('email')"
                name="email"
                [(ngModel)]="email"
                [status]="getEmailStatus()"
                fullWidth
              />
            </div>
          </div>
        </div>
        <div class="row mt-3">
          <button
            class="mt-3"
            nbButton
            shape="round"
            status="primary"
            (click)="resetPassword()"
          >
            {{ getString("sendResetPasswordEmail") }}
          </button>
        </div>
        <div class="row">
          <button
            class="mt-3"
            nbButton
            ghost
            shape="round"
            status="primary"
            (click)="cancel()"
          >
            {{ getString("cancel") }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
